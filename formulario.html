<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Pessoal | Contato</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>Meu Portfólio Pessoal</h1>
            <nav>
                <button id="toggle-theme" class="btn-tema" aria-label="Alternar Tema">🌓 Alternar Tema</button>
                <ul>
                    <li><a href="index.html">Apresentação</a></li>
                    <li><a href="curriculo.html">Currículo</a></li>
                    <li><a href="formulario.html" class="active">Contato</a></li>
                    <li><a href="multimidia.html">Multimídia</a></li>
                    <li><a href="graficos.html">Gráfico</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contato">
            <h2>Formulário de Contato</h2>
            <form action="#" method="POST">
                <div class="campo-form">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo-form">
                    <label for="email">E-mail de Contato:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo-form">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade">
                </div>

                <div class="campo-form">
                    <label for="data-retorno">Data Preferencial para Retorno:</label>
                    <input type="date" id="data-retorno" name="data-retorno">
                </div>

                <div class="campo-form">
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto">
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="orcamento">Orçamento / Projeto</option>
                        <option value="duvida">Dúvida Técnica</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="campo-form-row">
                    <label>Preferência de Contato:</label>
                    <div class="opcoes-checkbox">
                        <label><input type="checkbox" name="preferencia" value="email"> E-mail</label>
                        <label><input type="checkbox" name="preferencia" value="whatsapp"> WhatsApp</label>
                    </div>
                </div>

                <div class="campo-form">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

    <script src="StorageManager.js"></script>
    <script src="app.js"></script>
</body>
</html>
